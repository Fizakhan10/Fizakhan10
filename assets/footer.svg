<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="100%">
  <defs>
    <!-- Bright High-Contrast Gradient -->
    <linearGradient id="brightFooterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#C77B9B" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#F8F0F3" stop-opacity="1" />
      <stop offset="75%" stop-color="#C77B9B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="brightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Divider Line -->
  <line x1="40" y1="28" x2="860" y2="28" stroke="url(#brightFooterGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#brightGlow)" />

  <!-- Moving Glowing Pulse Orb -->
  <circle cx="450" cy="28" r="5" fill="#F8F0F3" filter="url(#brightGlow)">
    <animate attributeName="cx" values="60;840;60" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Bold High-Visibility Text -->
  <text x="450" y="58" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="12" fill="#F8F0F3" text-anchor="middle" letter-spacing="3.5">
    ✦ DESIGNED & DEVELOPED BY FIZA KHALIL ✦
  </text>
</svg>
