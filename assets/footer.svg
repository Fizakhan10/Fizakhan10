<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="100%">
  <defs>
    <!-- High Contrast Bold Gradient -->
    <linearGradient id="boldFooterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.2" />
      <stop offset="25%" stop-color="#C77B9B" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F8F0F3" stop-opacity="1" />
      <stop offset="75%" stop-color="#C77B9B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="boldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Bold Divider Line -->
  <line x1="40" y1="28" x2="860" y2="28" stroke="url(#boldFooterGrad)" stroke-width="3" stroke-linecap="round" filter="url(#boldGlow)" />

  <!-- Moving Glowing Pulse Orb -->
  <circle cx="450" cy="28" r="6" fill="#F8F0F3" filter="url(#boldGlow)">
    <animate attributeName="cx" values="60;840;60" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Bold High-Visibility Text -->
  <text x="450" y="60" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" font-weight="800" font-size="13" fill="#F8F0F3" text-anchor="middle" letter-spacing="4">
    ✦ DESIGNED AND DEVELOPED BY FIZA KHALIL ✦
  </text>
</svg>
