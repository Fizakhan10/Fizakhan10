<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="100%" height="100%">
  <defs>
    <linearGradient id="footerLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10070C" stop-opacity="0" />
      <stop offset="30%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="1" />
      <stop offset="70%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Line -->
  <line x1="50" y1="20" x2="850" y2="20" stroke="url(#footerLineGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Animated Glowing Orb -->
  <circle cx="450" cy="20" r="4" fill="#C77B9B">
    <animate attributeName="cx" values="100;800;100" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Text -->
  <text x="450" y="45" font-family="&#39;Courier New&#39;, monospace" font-size="11" fill="#E5B5C7" text-anchor="middle" letter-spacing="3" opacity="0.85">
    DESIGNED AND DEVELOPED BY FIZA KHALIL
  </text>
</svg>
