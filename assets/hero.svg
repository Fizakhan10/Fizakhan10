<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Dark Burgundy Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#451126" />
    </linearGradient>

    <!-- Moving Glow Radial Gradient -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#701A3D;#C77B9B;#701A3D" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F0F3" />
      <stop offset="50%" stop-color="#E5B5C7" />
      <stop offset="100%" stop-color="#C77B9B" />
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#701A3D" stroke-width="0.5" stroke-opacity="0.2" />
      <circle cx="30" cy="30" r="1" fill="#C77B9B" fill-opacity="0.3" />
    </pattern>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12" />
  
  <!-- Animated Glow Orb -->
  <circle cx="450" cy="160" r="250" fill="url(#glowGrad)">
    <animate attributeName="cx" values="300;600;300" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="100;220;100" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#grid)" rx="12" />

  <!-- Orbital Geometry Lines -->
  <g stroke="#C77B9B" stroke-opacity="0.25" fill="none" stroke-width="1">
    <ellipse cx="450" cy="160" rx="380" ry="110">
      <animateTransform attributeName="transform" type="rotate" from="0 450 160" to="360 450 160" dur="30s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="450" cy="160" rx="280" ry="80">
      <animateTransform attributeName="transform" type="rotate" from="360 450 160" to="0 450 160" dur="20s" repeatCount="indefinite" />
    </ellipse>
  </g>

  <!-- Main Name Title -->
  <text x="450" y="140" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, sans-serif" font-weight="800" font-size="44" fill="url(#textGrad)" text-anchor="middle" letter-spacing="3">
    FIZA KHALIL
  </text>

  <!-- Animated Glowing Underline -->
  <path d="M 280 160 L 620 160" stroke="#C77B9B" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="0,340;340,0;0,340" dur="4s" repeatCount="indefinite" />
  </path>

  <!-- Subtitle / Role -->
  <text x="450" y="200" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, sans-serif" font-weight="500" font-size="18" fill="#E5B5C7" text-anchor="middle" letter-spacing="4">
    FULL-STACK DEVELOPER | MERN STACK | CREATIVE TECHNOLOGIST
  </text>

  <!-- Bottom Technical Badge Accent -->
  <g transform="translate(450, 250)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#190B12" stroke="#701A3D" stroke-width="1.5" />
    <circle cx="-110" cy="0" r="4" fill="#C77B9B">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="10" y="5" font-family="&#39;Courier New&#39;, monospace" font-weight="600" font-size="12" fill="#F8F0F3" text-anchor="middle" letter-spacing="1.5">
      BUILDING DIGITAL EXPERIENCES
    </text>
  </g>
</svg>
